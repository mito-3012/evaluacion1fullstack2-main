<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GamerZone</title>
    <!-- Vinculación del CSS unificado -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="logo"><span class="logo-icon">🎮</span><h1>GamerZone</h1></div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="productos.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Noticias</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <div class="header-right">
            <a href="carrito.html" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a>
        </div>
    </header>

    <main class="container flex-center">
        <div class="form-card">
            <div class="brand-box">
                <span class="logo-icon">🎮</span>
                <h2>GamerZone</h2>
            </div>
            <div class="card-header">INICIO DE SESIÓN</div>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">CORREO</label>
                    <input type="email" id="login-email" class="form-control" placeholder="gamer@duoc.cl" autocomplete="email">
                    <span class="error-message" id="err-login-email"></span>
                </div>
                <div class="form-group">
                    <label for="login-pass">CONTRASEÑA</label>
                    <input type="password" id="login-pass" class="form-control" autocomplete="current-password">
                    <span class="error-message" id="err-login-pass"></span>
                </div>
                <button type="submit" class="btn btn-outline btn-block">INGRESAR</button>
            </form>
        </div>
    </main>

    <!-- Carga de Scripts JS unificados -->
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/app.js"></script>
    <script src="../javascript/validaciones.js"></script>
</body>
</html>
